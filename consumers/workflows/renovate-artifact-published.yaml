# GENERATED/SHARED WORKFLOW: copied into consuming repos by sync-shared.
# Do not edit in consuming repos; change jr200-labs/github-action-templates and sync.
name: renovate-artifact-published

on:
  repository_dispatch:
    types: [artifact-published]
  workflow_dispatch:
    inputs:
      dependencies:
        description: JSON array of exact Renovate dependency names
        required: true
        type: string
      artifact-name:
        description: Artifact name for the run summary
        required: false
        type: string
        default: manual
      artifact-version:
        description: Artifact version for the run summary
        required: false
        type: string
        default: manual

# The reusable serializes this with manual and scheduled Renovate runs.

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: read
  packages: read

jobs:
  renovate:
    # The reusable validates and normalizes this exact dependency array before
    # constructing its targeted config. Keeping validation in that job avoids
    # an otherwise empty ARC runner transition on the publication path.
    uses: jr200-labs/github-action-templates/.github/workflows/renovate.yaml@master
    with:
      dependency-names: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.dependencies) || inputs.dependencies }}
      repair-branches: false
      renovate-image: ${{ vars.RENOVATE_IMAGE }}
    secrets:
      INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
