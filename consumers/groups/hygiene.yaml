# Hygiene group — universal CI checks every consuming repo should opt
# into. Catches malformed commits, banned PR metadata, drift between
# the on-disk caller workflows and the canonical templates, and keeps
# Renovate alive on the repo.
includes:
  - lint-pr-metadata
  - commitlint
  - drift-check
  - sync-shared-drift
  - renovate
  - lint-no-auto-merge
  - lint-version-downgrades
  - lint-workflow-runners
  - actions-storage
files:
  - .shared/cleanup-actions-artifacts.py
