name: Bind macOS verification to packaging
description: Match source, toolchain inputs and execution budget between preparation jobs
inputs:
  mode:
    description: stage-identity, verify-save or verify-check
    required: true
  config:
    description: Repository app configuration
    default: .github/macos-app.json
  release-tag:
    description: Exact release tag, empty for PR verification
    default: ''
  key:
    description: Exact verification input key
    default: ''
  spent:
    description: Verification execution seconds consumed from the shared budget
    default: '0'
outputs:
  source:
    description: Checked source commit
    value: ${{ steps.reuse.outputs.source }}
  key:
    description: Content and toolchain identity
    value: ${{ steps.reuse.outputs.key }}
runs:
  using: composite
  steps:
    - id: reuse
      shell: bash
      env:
        REUSE_MODE: ${{ inputs.mode }}
        REUSE_CONFIG: ${{ inputs.config }}
        REUSE_TAG: ${{ inputs.release-tag }}
        REUSE_KEY: ${{ inputs.key }}
        REUSE_SPENT: ${{ inputs.spent }}
        UV_MANAGED_PYTHON: 'true'
      run: python3 "$GITHUB_ACTION_PATH/reuse.py"
