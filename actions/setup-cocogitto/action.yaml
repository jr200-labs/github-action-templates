name: Set up Cocogitto
description: Install a working Cocogitto binary with bounded download retries.
inputs:
  version:
    description: Cocogitto release version without a leading v.
    default: '7.0.0'
runs:
  using: composite
  steps:
    - id: preinstalled
      shell: bash
      env:
        COCOGITTO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        binary=$(command -v cog || true)
        if [ -n "$binary" ] && [ "$("$binary" --version)" = "cog ${COCOGITTO_VERSION#v}" ]; then
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
        fi
    - id: cache
      if: steps.preinstalled.outputs.binary == ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/cocogitto/bin
        key: cocogitto-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - if: steps.preinstalled.outputs.binary == '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COCOGITTO_VERSION: ${{ inputs.version }}
        COCOGITTO_ACTION_PATH: ${{ github.action_path }}
      run: bash "${COCOGITTO_ACTION_PATH}/install.sh"
    - shell: bash
      env:
        COCOGITTO_BIN: ${{ runner.temp }}/cocogitto/bin
        PREINSTALLED_COG: ${{ steps.preinstalled.outputs.binary }}
      run: |
        set -euo pipefail
        binary=${PREINSTALLED_COG:-$COCOGITTO_BIN/cog}
        "$binary" --version
        dirname "$binary" >> "$GITHUB_PATH"
    - if: steps.preinstalled.outputs.binary == '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/cocogitto/bin
        key: ${{ steps.cache.outputs.cache-primary-key }}
