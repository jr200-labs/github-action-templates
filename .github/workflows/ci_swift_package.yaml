name: template-ci-swift-package
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve packages
        run: swift package resolve
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/swift-package-verify.py ]; then
            # Lifecycle projects retain their provisioned compiler reuse contract.
            python3 scripts/swift-package-verify.py
          else
            swift build -Xswiftc -warnings-as-errors
            swift test
          fi
