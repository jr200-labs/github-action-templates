name: template-build-docker-image-multiplatform

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: "refs/heads/master"
      registry_name:
        description: docker-registry-name
        required: false
        type: string
        default: ghcr.io
      image_name:
        description: docker-image-name
        required: true
        type: string
      tag:
        description: docker-image-tag
        required: true
        type: string
      source-sha:
        description: Commit SHA represented by a release image tag
        required: false
        type: string
        default: ''
      success-tag-prefix:
        description: 'Git tag prefix published after the image manifest succeeds. Defaults to the image name.'
        required: false
        type: string
        default: ''
      platforms:
        description: platform-filter-json
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label override for all jobs. Defaults to the caller org RUNNER_PROFILE heavy/default tiers.'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile, relative to repo root (optional). When empty, auto-detects at docker/Dockerfile or ./Dockerfile. Set explicitly for monorepos with multiple images (e.g. images/base/Dockerfile).'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context directory, relative to repo root. Default: repo root.'
        required: false
        type: string
        default: '.'
      build-contexts:
        description: 'Optional newline-delimited additional build contexts for docker/build-push-action (e.g. "upstream=https://github.com/org/repo.git#v1.2.3:path").'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Optional newline-delimited Docker build arguments.'
        required: false
        type: string
        default: ''
      enable-gha-cache-export:
        description: 'Export the Docker cache to GitHub Actions cache.'
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        required: true
      registry_token:
        required: true
      git_token:
        required: false
        description: "Legacy token for cloning private git dependencies during Docker build. Prefer client_id + app_private_key."
      client_id:
        required: false
        description: "GitHub App Client ID for generating a token to clone private git deps"
      app_private_key:
        required: false
        description: "GitHub App private key for generating a token to clone private git deps"
      build_secrets:
        required: false
        description: |
          BuildKit secrets to forward to docker/build-push-action's `secrets:` field. Multiline string of `id=value` (or `id=...,env=VAR` / `id=...,src=path`) lines. Use for cross-private-repo fetches at build time (e.g. `oras pull` from GHCR with the caller's GITHUB_TOKEN). Consumed in Dockerfile via `RUN --mount=type=secret,id=<id> ...`. Must be passed via the call's `secrets:` block — secret-typed values are stripped to empty when interpolated into `with:` inputs across the reusable-workflow boundary.

env:
  IMAGE_NAME: ${{ inputs.image_name }}
  # Honor inputs.image_name when set (monorepo image-variant layouts
  # need different package paths under the same repo, e.g.
  # ghcr.io/whengas/agent-base + agent-coder + agent-reviewer from
  # one whengas/agent-images repo). Falls back to github.repository
  # so existing single-image callers without image_name keep working.
  REGISTRY_IMAGE: ${{ inputs.registry_name }}/${{ inputs.image_name || github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEFAULT_UNIVERSE: |-
    [
      {"platform": "linux/amd64", "os": "linux", "architecture": "amd64", "build-runner": "${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].heavy || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}"},
      {"platform": "linux/arm64", "os": "linux", "architecture": "arm64", "build-runner": "${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].heavy || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}"}
    ]

jobs:
  setup-matrix:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
      sanitized_image_name: ${{ steps.create-matrix.outputs.sanitized_image_name }}
    steps:
      - name: Determine Platforms
        id: create-matrix
        run: |
          platforms='${{ inputs.platforms }}'
          docker_image_platforms='${{ vars.DOCKER_IMAGE_PLATFORMS }}'
          default_universe='${{ env.DEFAULT_UNIVERSE }}'

          echo "input filtered_platforms: $platforms"
          echo "org/repo DOCKER_IMAGE_PLATFORMS: $docker_image_platforms"
          echo "input default_universe: $default_universe"

          if [ -z "$platforms" ] || [ "$platforms" = "null" ]; then
            platforms="$docker_image_platforms"
          fi

          platforms_json=$(jq -nc --arg raw "$platforms" '
            ($raw | gsub("^\\s+|\\s+$"; "")) as $raw |
            if $raw == "" or $raw == "null" then
              ["linux/amd64", "linux/arm64"]
            else
              (try ($raw | fromjson) catch $raw) as $parsed |
              if ($parsed | type) == "array" then
                $parsed
              elif ($parsed | type) == "string" then
                ($parsed | split(","))
              else
                error("platforms must be a JSON array or comma-separated string")
              end
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(. != ""))
            end
          ')

          unknown_platforms=$(jq -nc \
            --argjson requested "$platforms_json" \
            --argjson universe "$default_universe" \
            '$requested - ($universe | map(.platform))')
          if [ "$unknown_platforms" != "[]" ]; then
            echo "::error::unsupported docker image platform(s): $unknown_platforms"
            exit 1
          fi

          result_matrix=$(echo "$default_universe" | jq -c \
            --argjson platforms "$platforms_json" \
            '[.[] | select(.platform as $platform | $platforms | index($platform))]')
          if [ "$result_matrix" = "[]" ]; then
            echo "::error::docker image platform filter resolved to an empty matrix"
            exit 1
          fi

          echo "resolved platforms: $platforms_json"
          echo set-matrix: $result_matrix
          echo "matrix=$result_matrix" >> $GITHUB_OUTPUT
          sanitized_image_name='${{ inputs.image_name }}'
          sanitized_image_name="${sanitized_image_name//\//-}"
          sanitized_image_name="${sanitized_image_name//:/-}"
          echo "sanitized_image_name=${sanitized_image_name}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.platform }} Image
    needs: setup-matrix
    runs-on: ${{ matrix.build-runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref }}

      - name: Set up QEMU
        if: ${{ !((runner.arch == 'X64' && matrix.architecture == 'amd64') || (runner.arch == 'ARM64' && matrix.architecture == 'arm64')) }}
        uses: docker/setup-qemu-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ inputs.registry_name }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_token }}

      - name: Detect Dockerfile
        id: detect-dockerfile
        run: |
          if [[ "${{ inputs.context }}" =~ ^https://github\.com/.+\.git#.+ ]]; then
            if [ -n "${{ inputs.dockerfile }}" ]; then
              echo "dockerfile=${{ inputs.dockerfile }}" >> $GITHUB_OUTPUT
            else
              echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          if [ -n "${{ inputs.dockerfile }}" ]; then
            if [ ! -f "${{ inputs.dockerfile }}" ]; then
              echo "::error::dockerfile input set to '${{ inputs.dockerfile }}' but file not found"
              exit 1
            fi
            echo "dockerfile=${{ inputs.dockerfile }}" >> $GITHUB_OUTPUT
          elif [ -f docker/Dockerfile ]; then
            echo "dockerfile=docker/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f Dockerfile ]; then
            echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "::error::No Dockerfile found at docker/Dockerfile or ./Dockerfile, and no dockerfile input set"
            exit 1
          fi

      - name: Check if private git deps auth is configured
        id: check-git-auth
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$APP_KEY" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping private git deps auth (client_id/app_private_key not configured)"
          fi
        env:
          CLIENT_ID: ${{ secrets.client_id }}
          APP_KEY: ${{ secrets.app_private_key }}

      - name: Generate token for private git deps
        if: steps.check-git-auth.outputs.available == 'true'
        id: git-auth
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Write netrc for private git deps
        if: steps.git-auth.outputs.token != ''
        run: printf 'machine github.com\nlogin x-access-token\npassword %s\n' "${{ steps.git-auth.outputs.token }}" > /tmp/.netrc

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          file: ${{ steps.detect-dockerfile.outputs.dockerfile }}
          context: ${{ inputs.context }}
          provenance: false
          # Keep the cache across release tags, but separate monorepo images and CPU architectures.
          # Export intermediate stages so dependency downloads and compiler work survive ephemeral runners.
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.platform }}
          cache-to: ${{ inputs.enable-gha-cache-export && format('type=gha,scope={0}-{1},mode=max', inputs.image_name, matrix.platform) || '' }}
          build-args: |
            BUILD_OS=${{ matrix.os }}
            BUILD_ARCH=${{ matrix.architecture }}
            ${{ inputs.build-args }}
          secret-files: |
            netrc=/tmp/.netrc
          secrets: |
            ${{ secrets.build_secrets }}
          build-contexts: |
            ${{ inputs.build-contexts }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # The double separator prevents a prefix image such as `org/padd`
          # from matching artifacts for `org/padd-supervisor` in the same run.
          name: digests-${{ needs.setup-matrix.outputs.sanitized_image_name }}--${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge platform specific Docker image into multi platform image
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    needs:
      - setup-matrix
      - build

    permissions:
      contents: write
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ needs.setup-matrix.outputs.sanitized_image_name }}--*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_token }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ inputs.tag }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ inputs.tag }}

      - name: Publish image success tag
        if: startsWith(inputs.tag, 'v') && inputs.source-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          SUCCESS_TAG_PREFIX: ${{ inputs.success-tag-prefix }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Skipping success tag for non-release image tag $IMAGE_TAG"
            exit 0
          fi

          image_name=${IMAGE_NAME##*/}
          success_tag="${SUCCESS_TAG_PREFIX:-$image_name}-${IMAGE_TAG}"
          existing_sha=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${success_tag}" \
            --jq '.object.sha' 2>/dev/null) || existing_sha=''

          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" = "$SOURCE_SHA" ]; then
              echo "::notice::Success tag $success_tag already points to $SOURCE_SHA"
              exit 0
            fi
            echo "::error::Success tag $success_tag already points to $existing_sha, not $SOURCE_SHA"
            exit 1
          fi

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${success_tag}" \
            -f sha="$SOURCE_SHA"
          echo "Published $success_tag at $SOURCE_SHA after verifying ${REGISTRY_IMAGE}:${IMAGE_TAG}"


      # - name: Repository Dispatch
      #   uses: peter-evans/repository-dispatch@v4
      #   if: github.event_name != 'workflow_dispatch'
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     event-type: ${{ inputs.next_workflow }}
      #     client-payload: |-
      #       {
      #         "ref": "${{ github.ref }}",
      #         "sha": "${{ github.sha }}",
      #         "tag": "${{ inputs.tag }}",
      #         "artifacts": "${{ env.REGISTRY_IMAGE }}:${{ inputs.tag }}"
      #       }
