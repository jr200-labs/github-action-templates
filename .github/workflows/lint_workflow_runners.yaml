name: template-lint-workflow-runners

on:
  workflow_call:
    inputs:
      runner:
        description: Runner selected by the caller profile
        required: false
        type: string
        default: ""
      workflows-dir:
        description: Directory containing caller workflows
        required: false
        type: string
        default: .github/workflows

permissions:
  contents: read

jobs:
  lint-workflow-runners:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    timeout-minutes: 5
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
      - name: Checkout template scripts
        uses: actions/checkout@v7
        with:
          repository: jr200-labs/github-action-templates
          ref: ${{ github.repository == 'jr200-labs/github-action-templates' && github.sha || 'master' }}
          path: _gha_templates
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Validate workflow runner selection and effective variables
        env:
          WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
          RUNNER_PROFILE: ${{ vars.RUNNER_PROFILE }}
          RUNNER_PROFILES: ${{ vars.RUNNER_PROFILES }}
        run: |
          args=("$WORKFLOWS_DIR")
          if [ -f .github/runner-policy.json ]; then
            args+=(--policy .github/runner-policy.json)
          fi
          ./_gha_templates/scripts/lint-workflow-runners.sh "${args[@]}"
      - name: Validate artifact retention, including bespoke workflows and local actions
        run: uv run --script ./_gha_templates/scripts/lint-artifact-retention.py
