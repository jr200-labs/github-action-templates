name: release-shared-ref

on:
  push:
    branches: [master]
    paths:
      - consumers/**
      - shared/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-shared-ref
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.INTEGRATION_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release next shared ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin 'refs/tags/shared-v*:refs/tags/shared-v*'

          existing="$(git tag --points-at HEAD | grep -E '^shared-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "$existing" ]; then
            next="$existing"
            echo "HEAD is already tagged with ${next}; ensuring the GitHub Release exists."
          else
            latest="$(git tag --list 'shared-v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)"
            if [ -z "$latest" ]; then
              next="shared-v0.1.0"
            else
              version="${latest#shared-v}"
              IFS=. read -r major minor patch <<<"$version"
              next="shared-v${major}.${minor}.$((patch + 1))"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$next" -m "Shared workflow surface ${next}"
            git push origin "refs/tags/${next}"
            echo "Published tag ${next}"
          fi

          if gh release view "$next" >/dev/null 2>&1; then
            echo "GitHub Release ${next} already exists."
            exit 0
          fi

          gh release create "$next" \
            --verify-tag \
            --title "$next" \
            --generate-notes
          echo "Published GitHub Release ${next}"
