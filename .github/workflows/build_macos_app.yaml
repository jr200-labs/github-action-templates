name: template-build-macos-app
on:
  workflow_call:
    outputs:
      artifact:
        description: Configured release artifact name
        value: ${{ jobs.package.outputs.artifact }}
      appcast:
        description: Optional appcast filename
        value: ${{ jobs.package.outputs.appcast }}
    inputs:
      config-path:
        description: Repository-owned app packaging JSON
        type: string
        default: .github/macos-app.json
      checkout-ref:
        description: Optional ref for non-release builds (empty uses the triggering ref)
        type: string
        default: ""
      release-tag:
        description: Existing GitHub Release tag; its source is built exactly
        type: string
        default: ""
      release-id:
        description: Immutable GitHub Release ID required for draft release builds
        type: string
        default: ""
      generate-appcast:
        description: Generate the configured signed Sparkle appcast for a release build
        type: boolean
        default: false
      publish-release:
        description: Publish the verified immutable package after verification and packaging succeed
        type: boolean
        default: false
      runner:
        description: macOS build runner label
        type: string
        default: ""
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Optional private key used by a configured Sparkle appcast generator
        required: false
jobs:
  portable:
    if: github.event_name != 'pull_request' || !(github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--'))
    runs-on: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checked.outputs.commit }}
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Resolve immutable draft release identity
        if: inputs.publish-release
        id: release
        uses: jr200-labs/github-action-templates/actions/macos-release@master
        with:
          mode: resolve
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          release-tag: ${{ inputs.release-tag }}
          release-id: ${{ inputs.release-id }}
      - name: Read portable configuration
        id: config
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        run: python3 .shared/package-macos-app.py metadata --config "$APP_CONFIG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.config.outputs.portable == 'true' && steps.config.outputs.setup_uv == 'true'
      - name: Verify portable inputs
        id: checked
        if: steps.config.outputs.portable == 'true'
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .shared/package-macos-app.py portable --config "$APP_CONFIG"
          git diff --exit-code HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: portable
    if: github.event_name != 'pull_request' || !(github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--'))
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].macos }}
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      key: ${{ steps.verification.outputs.key }}
      enabled: ${{ steps.verification.outputs.enabled }}
      source: ${{ steps.verification.outputs.source }}
      execution-seconds: ${{ steps.checks.outputs.execution-seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Ensure Metal toolchain
        shell: bash
        env:
          SCOTTY_TOOLCHAIN_REQUEST_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            exit 0
          fi
          scotty_cli="/Applications/Scotty.app/Contents/MacOS/scotty"
          if [ ! -x "$scotty_cli" ]; then
            scotty_cli="$HOME/Applications/Scotty.app/Contents/MacOS/scotty"
          fi
          if [ -x "$scotty_cli" ] && "$scotty_cli" status | python3 -c \
            'import json,sys; raise SystemExit("toolchain-catalog" not in json.load(sys.stdin).get("capabilities", []))'; then
            "$scotty_cli" ensure-toolchain \
              --toolchain metal-toolchain \
              --request-key "$SCOTTY_TOOLCHAIN_REQUEST_KEY" \
              --wait
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Read app configuration
        id: config
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        run: python3 .shared/package-macos-app.py metadata --config "$APP_CONFIG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.config.outputs.setup_uv == 'true'
      - name: Resolve verification inputs
        id: verification
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: stage-identity
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
      - name: Run configured verification
        id: checks
        uses: jr200-labs/github-action-templates/actions/macos-verify@master
        with:
          config: ${{ inputs.config-path }}
        env:
          MACOS_PACKAGE_RELEASE_ASSETS: ${{ inputs.publish-release && 'true' || 'false' }}
          MACOS_PORTABLE_COMMIT: ${{ needs.portable.outputs.commit }}
          UV_MANAGED_PYTHON: "true"
      - name: Record successful verification
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: verify-save
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ steps.verification.outputs.key }}
          spent: ${{ steps.checks.outputs.execution-seconds }}
      - name: Retain verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: macos-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-verification
          if-no-files-found: error
          retention-days: 5
          overwrite: true
  package:
    needs:
      - portable
      - verify
    if: github.event_name != 'pull_request' || !(github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--'))
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].macos }}
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      key: ${{ needs.verify.outputs.key }}
      source: ${{ needs.verify.outputs.source }}
      release-id: ${{ needs.portable.outputs.release-id }}
      artifact: ${{ steps.config.outputs.artifact }}
      appcast: ${{ inputs.generate-appcast && steps.config.outputs.appcast || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Ensure Metal toolchain
        shell: bash
        env:
          SCOTTY_TOOLCHAIN_REQUEST_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            exit 0
          fi
          scotty_cli="/Applications/Scotty.app/Contents/MacOS/scotty"
          if [ ! -x "$scotty_cli" ]; then
            scotty_cli="$HOME/Applications/Scotty.app/Contents/MacOS/scotty"
          fi
          if [ -x "$scotty_cli" ] && "$scotty_cli" status | python3 -c \
            'import json,sys; raise SystemExit("toolchain-catalog" not in json.load(sys.stdin).get("capabilities", []))'; then
            "$scotty_cli" ensure-toolchain \
              --toolchain metal-toolchain \
              --request-key "$SCOTTY_TOOLCHAIN_REQUEST_KEY" \
              --wait
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Read app configuration
        id: config
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        run: python3 .shared/package-macos-app.py metadata --config "$APP_CONFIG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.config.outputs.setup_uv == 'true'
      - name: Download verification receipt
        uses: actions/download-artifact@v8
        with:
          name: macos-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-verification
      - name: Validate verification source and inputs
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: verify-check
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ needs.verify.outputs.key }}
          spent: ${{ needs.verify.outputs.execution-seconds }}
      - name: Restore exact verified release archive
        if: inputs.publish-release && needs.verify.outputs.enabled == 'true'
        id: archive-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/macos-verified-release
          key: ${{ needs.verify.outputs.key }}
      - name: Check restored release evidence
        if: inputs.publish-release && steps.archive-cache.outputs.cache-hit == 'true'
        id: restored
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: restore
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ needs.verify.outputs.key }}
      - name: Build package
        if: steps.restored.outputs.reused != 'true'
        uses: jr200-labs/github-action-templates/actions/macos-package@master
        with:
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          output: ${{ runner.temp }}/macos-release
        env:
          MACOS_PACKAGE_RELEASE_ASSETS: ${{ inputs.publish-release && 'true' || 'false' }}
          UV_MANAGED_PYTHON: "true"
          MACOS_VERIFICATION_EXECUTION_SECONDS: ${{ needs.verify.outputs.execution-seconds }}
          MACOS_VERIFIED_SOURCE: ${{ needs.verify.outputs.source }}
          MACOS_VERIFICATION_INPUT_KEY: ${{ needs.verify.outputs.key }}
      - name: Prepare immutable verified release archive
        if: inputs.publish-release && needs.verify.outputs.enabled == 'true' && steps.restored.outputs.reused != 'true'
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: save
          spent: ${{ needs.verify.outputs.execution-seconds }}
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ needs.verify.outputs.key }}
      - name: Save verified release before publication
        if: inputs.publish-release && needs.verify.outputs.enabled == 'true' && steps.restored.outputs.reused != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/macos-verified-release
          key: ${{ needs.verify.outputs.key }}
      - name: Generate signed Sparkle appcast
        if: inputs.publish-release && inputs.generate-appcast && steps.config.outputs.appcast != ''
        env:
          APP_CONFIG: ${{ inputs.config-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
          python3 .shared/package-macos-app.py appcast \
            --config "$APP_CONFIG" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/macos-release"
      - name: Seal verified publication bundle
        if: inputs.publish-release
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: bundle-save
          spent: ${{ needs.verify.outputs.execution-seconds }}
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ needs.verify.outputs.key }}
          source: ${{ needs.verify.outputs.source }}
          appcast: ${{ inputs.generate-appcast && steps.config.outputs.appcast || '' }}
      - name: Retain immutable publication bundle
        if: inputs.publish-release
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-release
          if-no-files-found: error
          retention-days: 5
          overwrite: true
  publish:
    needs: package
    if: inputs.publish-release
    runs-on: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Download verified publication bundle
        uses: actions/download-artifact@v8
        with:
          name: macos-release-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-release
      - name: Validate publication bytes and provenance
        uses: jr200-labs/github-action-templates/actions/macos-verified-build@master
        with:
          mode: bundle-check
          config: ${{ inputs.config-path }}
          release-tag: ${{ inputs.release-tag }}
          key: ${{ needs.package.outputs.key }}
          source: ${{ needs.package.outputs.source }}
          appcast: ${{ needs.package.outputs.appcast }}
      - name: Verify and attach release assets
        uses: jr200-labs/github-action-templates/actions/macos-release@master
        with:
          mode: publish
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          release-tag: ${{ inputs.release-tag }}
          release-id: ${{ needs.package.outputs.release-id }}
          output: ${{ runner.temp }}/macos-release
          artifact: ${{ needs.package.outputs.artifact }}
          appcast: ${{ needs.package.outputs.appcast }}
