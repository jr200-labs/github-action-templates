name: template-build-macos-app

on:
  workflow_call:
    outputs:
      artifact:
        description: Configured release artifact name
        value: ${{ jobs.package.outputs.artifact }}
      appcast:
        description: Optional appcast filename
        value: ${{ jobs.package.outputs.appcast }}
    inputs:
      config-path:
        description: Repository-owned app packaging JSON
        type: string
        default: .github/macos-app.json
      checkout-ref:
        description: Optional ref for non-release builds (empty uses the triggering ref)
        type: string
        default: ''
      release-tag:
        description: Existing GitHub Release tag; its source is built exactly
        type: string
        default: ''
      release-id:
        description: Immutable GitHub Release ID required for draft release builds
        type: string
        default: ''
      generate-appcast:
        description: Generate the configured signed Sparkle appcast for a release build
        type: boolean
        default: false
      publish-release:
        description: Verify, attach and publish the draft release from this same job
        type: boolean
        default: false
      runner:
        description: macOS build runner label
        type: string
        default: ''
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Optional private key used by a configured Sparkle appcast generator
        required: false

jobs:
  package:
    # Version-bump PRs are packaged once, from their tag, by the release event.
    # Keep this gate inside the reusable job so its required check still exists.
    if: github.event_name != 'pull_request' || !(github.event.pull_request.user.type == 'Bot' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--'))
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].macos }}
    timeout-minutes: 30
    # Inherit the caller's token ceiling: read for PR builds and write for the
    # release caller that publishes directly from this native build workspace.
    outputs:
      artifact: ${{ steps.config.outputs.artifact }}
      appcast: ${{ steps.config.outputs.appcast }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Ensure Metal toolchain
        shell: bash
        env:
          SCOTTY_TOOLCHAIN_REQUEST_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            exit 0
          fi
          scotty_cli="/Applications/Scotty.app/Contents/MacOS/scotty"
          if [ ! -x "$scotty_cli" ]; then
            scotty_cli="$HOME/Applications/Scotty.app/Contents/MacOS/scotty"
          fi
          if [ -x "$scotty_cli" ] && "$scotty_cli" status | python3 -c \
            'import json,sys; raise SystemExit("toolchain-catalog" not in json.load(sys.stdin).get("capabilities", []))'; then
            "$scotty_cli" ensure-toolchain \
              --toolchain metal-toolchain \
              --request-key "$SCOTTY_TOOLCHAIN_REQUEST_KEY" \
              --wait
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Resolve immutable draft release identity
        if: inputs.publish-release
        id: release
        uses: jr200-labs/github-action-templates/actions/macos-release@master
        with:
          mode: resolve
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          release-tag: ${{ inputs.release-tag }}
          release-id: ${{ inputs.release-id }}
      - name: Read app configuration
        id: config
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        run: python3 .shared/package-macos-app.py metadata --config "$APP_CONFIG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.config.outputs.setup_uv == 'true'
      - name: Build and verify
        env:
          APP_CONFIG: ${{ inputs.config-path }}
          MACOS_PACKAGE_RELEASE_ASSETS: ${{ inputs.publish-release && 'true' || 'false' }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          UV_MANAGED_PYTHON: 'true'
        run: python3 .shared/package-macos-app.py package --config "$APP_CONFIG" --release-tag "$RELEASE_TAG" --output "$RUNNER_TEMP/macos-release"
      - name: Generate signed Sparkle appcast
        if: inputs.publish-release && inputs.generate-appcast && steps.config.outputs.appcast != ''
        env:
          APP_CONFIG: ${{ inputs.config-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
          python3 .shared/package-macos-app.py appcast \
            --config "$APP_CONFIG" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/macos-release"
      - name: Verify and attach release assets
        if: inputs.publish-release
        uses: jr200-labs/github-action-templates/actions/macos-release@master
        with:
          mode: publish
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          release-tag: ${{ inputs.release-tag }}
          release-id: ${{ steps.release.outputs.release-id }}
          output: ${{ runner.temp }}/macos-release
          artifact: ${{ steps.config.outputs.artifact }}
          appcast: ${{ steps.config.outputs.appcast }}
