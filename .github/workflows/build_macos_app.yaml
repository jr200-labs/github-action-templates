name: template-build-macos-app

on:
  workflow_call:
    outputs:
      artifact:
        description: Uploaded artifact name
        value: ${{ jobs.package.outputs.artifact }}
      appcast:
        description: Optional appcast filename
        value: ${{ jobs.package.outputs.appcast }}
    inputs:
      config-path:
        description: Repository-owned app packaging JSON
        type: string
        default: .github/macos-app.json
      checkout-ref:
        description: Optional ref for non-release builds (empty uses the triggering ref)
        type: string
        default: ''
      release-tag:
        description: Existing GitHub Release tag; its source is built exactly
        type: string
        default: ''
      release-id:
        description: Immutable GitHub Release ID required for draft release builds
        type: string
        default: ''
      generate-appcast:
        description: Generate the configured signed Sparkle appcast for a release build
        type: boolean
        default: false
      runner:
        description: macOS build runner label
        type: string
        default: ''
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Optional private key used by a configured Sparkle appcast generator
        required: false

jobs:
  package:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].macos }}
    timeout-minutes: 30
    # Release builds verify an unpublished draft by immutable ID. The caller
    # limits ordinary CI invocations to contents:read, while the release caller
    # grants the contents:write access GitHub requires to expose drafts.
    permissions:
      contents: write
    outputs:
      artifact: ${{ steps.config.outputs.artifact }}
      appcast: ${{ steps.config.outputs.appcast }}
    steps:
      - name: Validate release
        if: inputs.generate-appcast || inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_ID: ${{ inputs.release-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          if [[ -n "$RELEASE_ID" ]]; then
            [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" |
              jq -e --arg tag "$RELEASE_TAG" --argjson id "$RELEASE_ID" \
                '.id == $id and .tag_name == $tag and .draft == true'
          else
            if ${{ inputs.generate-appcast }}; then
              echo "::error::Draft release builds require an immutable release ID."
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json tagName,isDraft |
              jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false'
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || inputs.checkout-ref }}
          persist-credentials: false
      - name: Read app configuration
        id: config
        env:
          APP_CONFIG: ${{ inputs.config-path }}
        run: python3 .shared/package-macos-app.py metadata --config "$APP_CONFIG" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.config.outputs.setup_uv == 'true'
      - name: Build, verify and archive
        env:
          APP_CONFIG: ${{ inputs.config-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          UV_MANAGED_PYTHON: 'true'
        run: python3 .shared/package-macos-app.py package --config "$APP_CONFIG" --release-tag "$RELEASE_TAG" --output "$RUNNER_TEMP/macos-release"
      - name: Generate signed Sparkle appcast
        if: inputs.generate-appcast && steps.config.outputs.appcast != ''
        env:
          APP_CONFIG: ${{ inputs.config-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
          python3 .shared/package-macos-app.py appcast \
            --config "$APP_CONFIG" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/macos-release"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.artifact }}
          path: ${{ runner.temp }}/macos-release/*
          if-no-files-found: error
          retention-days: 14
