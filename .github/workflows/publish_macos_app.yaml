name: template-publish-macos-app

on:
  workflow_call:
    inputs:
      config-path:
        description: Repository-owned app packaging JSON
        type: string
        default: .github/macos-app.json
      release-tag:
        description: Existing draft GitHub Release tag to build, complete and publish
        type: string
        required: true
      release-id:
        description: Immutable ID of the draft GitHub Release
        type: string
        default: ''
      runner:
        description: macOS build runner label
        type: string
        default: ''
      reuse-verified-build:
        description: Reuse exact successful CI artifacts (caller must grant actions read)
        type: boolean
        default: false
      publish-runner:
        description: Deprecated compatibility input; publication now runs on the macOS build runner
        type: string
        default: ''
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY:
        description: Optional private key used by a configured Sparkle appcast generator
        required: false

jobs:
  package:
    # Inherit the caller's ceiling. Existing callers can build without actions
    # read; synchronized callers grant it and explicitly enable artifact reuse.
    uses: jr200-labs/github-action-templates/.github/workflows/build_macos_app.yaml@master
    with:
      config-path: ${{ inputs.config-path }}
      release-tag: ${{ inputs.release-tag }}
      release-id: ${{ inputs.release-id }}
      generate-appcast: true
      publish-release: true
      reuse-verified-build: ${{ inputs.reuse-verified-build }}
      runner: ${{ inputs.runner }}
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
