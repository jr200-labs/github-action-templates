name: template-build-quarto-docs

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: "refs/heads/master"
      site-path:
        description: "Path to the Quarto site directory"
        required: false
        type: string
        default: "docs"
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build and assemble main document
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0

      - uses: quarto-dev/quarto-actions/setup@v2.2.0

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2.2.0
        with:
          path: ${{ inputs.site-path }}
          to: html

      - name: Initialize GitHub Pages branch
        env:
          PAGES_BRANCH: gh-pages
          GIT_AUTHOR_NAME: Quarto GHA Workflow Runner
          GIT_AUTHOR_EMAIL: quarto-github-actions-publish@example.com
          GIT_COMMITTER_NAME: Quarto GHA Workflow Runner
          GIT_COMMITTER_EMAIL: quarto-github-actions-publish@example.com
        run: |
          if ! git ls-remote --exit-code --heads origin "refs/heads/${PAGES_BRANCH}" >/dev/null 2>&1; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(printf '%s\n' 'chore: initialize GitHub Pages' | git commit-tree "${empty_tree}")"
            git push origin "${commit}:refs/heads/${PAGES_BRANCH}"
          fi

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2.2.0
        with:
          path: ${{ inputs.site-path }}
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
