name: template-renovate

# Self-hosted Renovate via GitHub Actions, scoped to the calling repo only.
#
# This bypasses Mend Cloud entirely. Each consuming repo runs Renovate
# against itself on its own schedule. The per-repo `renovate.json`
# (which extends `github>jr200-labs/github-action-templates`) is
# auto-discovered.
#
# Authentication. Renovate runs against three datasources that need real
# auth: cross-repo private git tags (e.g. a private package @ git+https...),
# the ghcr.io container registry, and the calling repo itself for
# branch/PR/issue creation. The org-level GitHub App secrets cover all of
# this when present:
#
#   * vars.INTEGRATION_APP_ID (= the App's numeric ID)
#   * secrets.INTEGRATION_APP_PRIVATE_KEY (= the App's .pem contents)
#
# Consumer orgs publish these as org-level secrets/variables with
# visibility ALL, populated by a per-org integration App (see JRL-18 for
# the architecture).
#
# When the App secrets are present (the normal case for configured
# consumer orgs), this workflow mints a short-lived installation token
# via actions/create-github-app-token and feeds it to Renovate as
# RENOVATE_TOKEN. When they are not present (e.g. a personal-account
# repo), it falls back to the runner's GITHUB_TOKEN — Renovate still
# works for public datasources (PyPI, npm, github-actions on public
# repos) but cross-repo private lookups will fail with "no-result" and
# the resulting PRs will not trigger downstream CI workflows on the same
# repo. The PR creation itself still works.
#
# Consumer usage (per-repo `.github/workflows/renovate.yml`):
#
#     name: renovate
#     on:
#       schedule:
#         - cron: '17 */4 * * *'
#       workflow_dispatch:
#     jobs:
#       renovate:
#         uses: jr200-labs/github-action-templates/.github/workflows/renovate.yml@master
#         secrets: inherit
#
# `secrets: inherit` is what wires the org-level INTEGRATION_APP_*
# secrets through to the reusable workflow. Without it the App token
# step silently falls back to GITHUB_TOKEN.

on:
  workflow_call:
    inputs:
      log-level:
        description: Renovate LOG_LEVEL — info | debug | trace
        required: false
        type: string
        default: debug
      dry-run:
        description: Renovate dry-run mode (full | extract | lookup | empty for normal)
        required: false
        type: string
        default: ''
      config-file:
        description: Optional Renovate config file path for scoped/manual lanes
        required: false
        type: string
        default: ''
      dependency-names:
        description: Optional JSON array of exact Renovate depName values to update
        required: false
        type: string
        default: ''
      client-id:
        description: >
          GitHub App Client ID for minting installation tokens. Callers should
          pass vars.INTEGRATION_CLIENT_ID in their with: block so the
          expression is evaluated in the caller's context, sidestepping
          a GitHub limitation where org-level variables don't resolve
          inside cross-org reusable workflows. If omitted, falls back
          to vars.INTEGRATION_CLIENT_ID evaluated inside the reusable
          workflow (works for same-org callers and callers with per-repo
          variable overrides). See GOTCHAS.md for details.
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''
      repair-branches:
        description: Run post-Renovate branch repair helpers
        required: false
        type: boolean
        default: true
      repair-lockfiles:
        description: Overwrite stale pnpm lockfiles on existing Renovate branches
        required: false
        type: boolean
        default: false
      rebase-branches:
        description: Rebase Renovate branches that are behind the base branch
        required: false
        type: boolean
        default: false
      renovate-image:
        description: Optional Renovate image reference
        required: false
        type: string
        default: ''
    secrets:
      # The App private key is declared as an explicit named secret input
      # because GitHub Actions has a quirk: variables inherited via
      # `secrets: inherit` work across orgs, but SECRETS inherited the same
      # way only work within the same org. Cross-org callers need the
      # secret named explicitly so it can be passed through.
      INTEGRATION_APP_PRIVATE_KEY:
        description: Org-level GitHub App private key (per-org integration App)
        required: false

jobs:
  renovate:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Mint App installation token
        id: app-token
        # Use App auth whenever the App credentials are wired through.
        # The previous `visibility == 'private'` predicate was based
        # on a misreading of GitHub's rule: only PRIVATE repos in
        # Free orgs are blocked from org secrets — public repos in
        # Free orgs CAN read them. Skipping the mint on public repos
        # left Renovate falling back to GITHUB_TOKEN, which has no
        # permission key for /repos/*/dependabot/alerts and produces
        # a perpetual "Cannot access vulnerability alerts" WARN.
        if: ${{ inputs.client-id != '' || vars.INTEGRATION_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ inputs.client-id || vars.INTEGRATION_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git HTTPS auth for post-upgrade tasks
        shell: bash
        run: |
          printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$RENOVATE_GITHUB_TOKEN" > ~/.netrc
          chmod 0600 ~/.netrc
        env:
          RENOVATE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Restore Renovate cache
        # A manual run means "check upstream now". Restoring the datasource
        # cache can hide a release published moments earlier until Renovate's
        # soft TTL expires. Scheduled runs retain the cache for efficiency.
        if: github.event_name != 'workflow_dispatch' && inputs.dependency-names == ''
        uses: actions/cache@v6
        with:
          path: .renovate-out/cache
          key: renovate-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ runner.os }}-${{ github.repository_id }}-

      - name: Prepare Renovate writable dirs
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.renovate-out/cache"
          chmod -R u+rwX,go+rwX "$GITHUB_WORKSPACE/.renovate-out"

      - name: Build targeted Renovate config
        id: targeted-config
        if: inputs.dependency-names != ''
        shell: bash
        env:
          DEPENDENCY_NAMES: ${{ inputs.dependency-names }}
          BASE_CONFIG: ${{ inputs.config-file || 'renovate.json' }}
        run: |
          set -euo pipefail
          dependencies=$(jq -ce '
            if type != "array" or length == 0 or length > 50 or
               any(.[]; type != "string" or length == 0 or length > 200)
            then error("dependency-names must be a non-empty JSON array of at most 50 strings")
            else unique
            end
          ' <<<"$DEPENDENCY_NAMES")
          [ -f "$BASE_CONFIG" ] || {
            echo "::error::Renovate base config not found: $BASE_CONFIG"
            exit 1
          }
          jq --argjson dependencies "$dependencies" '
            .pruneStaleBranches = false
            | .packageRules = ((.packageRules // []) + [
              {
                "description": "Publication-triggered run: disable dependencies by default.",
                "matchPackageNames": ["/.*/"],
                "enabled": false
              },
              {
                "description": "Publication-triggered run: enable exact dependency names.",
                "matchDepNames": $dependencies,
                "enabled": true
              }
            ])
          ' "$BASE_CONFIG" > "$GITHUB_WORKSPACE/.renovate-out/targeted-config.json"
          # renovatebot/github-action validates this path on the runner, then
          # mounts the file into its container and rewrites the config env var.
          # Keep it runner-relative; /out exists only inside the container.
          echo "config-file=.renovate-out/targeted-config.json" >> "$GITHUB_OUTPUT"
          echo "Targeted dependencies: $dependencies"

      - name: Self-hosted Renovate (pass 1)
        # renovatebot/github-action only publishes specific patch tags, no
        # floating majors. Pin to a known-good release; Renovate itself can
        # be updated independently of this action via the `renovate-version`
        # input below if needed.
        uses: renovatebot/github-action@v46.2.6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          renovate-image: ${{ inputs.renovate-image || 'ghcr.io/renovatebot/renovate' }}
          renovate-version: 43.275.0
          # Use host networking so the Renovate container shares the
          # runner pod's network. Dind's default bridge network has
          # routing issues that cause ETIMEDOUT on api.github.com.
          docker-network: host
          # Mount the world-writable report dir into the container. The cache
          # lives under /out/cache so renovatebot/github-action only needs one
          # docker-volumes entry; multiple entries are passed to docker as one
          # malformed --volume value by v46.1.16.
          # ARC dind shares `_work` (= github.workspace) with the runner
          # via emptyDir, so writes here are visible to subsequent
          # runner steps. The renovate container runs as `node` (uid
          # 1000) which can't write directly to the runner-owned
          # workspace; the prepared writable subdirs sidestep that.
          docker-volumes: |
            ${{ github.workspace }}/.renovate-out:/out
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy|PNPM_CONFIG_MINIMUM_RELEASE_AGE)$'
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          # Install Renovate as a node package instead of docker run.
          # Self-hosted ARC runners use dind whose inner containers
          # can't resolve DNS to api.github.com (ETIMEDOUT).
          RENOVATE_BINARY_SOURCE: install
          # Persist Renovate's HTTP/release metadata, repository JSON cache,
          # and containerbase tool downloads between workflow runs.
          RENOVATE_CACHE_DIR: /out/cache
          RENOVATE_REPOSITORY_CACHE: 'enabled'
          # Restrict Renovate to the current repo only.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The per-repo renovate.json already exists (it extends the shared
          # preset). Skip the onboarding PR flow so Renovate doesn't open a
          # "Configure Renovate" PR.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Allow tightly-scoped repo-local Renovate helpers. Keep executable
          # post-upgrade automation under .renovate/ so repositories can use
          # documented metadata-driven helper scripts without enabling broad
          # command execution. `uv lock` is allowed exactly so Python
          # dependency PRs can keep uv.lock synchronized with pyproject.toml.
          RENOVATE_ALLOWED_COMMANDS: '^(?:uv lock(?: --refresh)?|\./\.renovate/[A-Za-z0-9_.-]+\.py|\./scripts/sync-shared)$'
          # Optional dry-run for debugging without creating branches/PRs.
          RENOVATE_DRY_RUN: ${{ inputs.dry-run }}
          # Normal Renovate lockfile maintenance must not enforce the
          # package-age policy. That belongs to check_pnpm_package_age.yaml.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
          # Renovate filters environment variables again before invoking
          # package managers. Explicitly expose the age override to pnpm.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"PNPM_CONFIG_MINIMUM_RELEASE_AGE":"0"}'
          # Structured JSON report (problems[] = WARN/ERROR messages).
          # Written into /out (runner's ${GITHUB_WORKSPACE}/.renovate-out,
          # 0777, mounted above) so the post-step can read it.
          RENOVATE_REPORT_TYPE: 'file'
          RENOVATE_REPORT_PATH: /out/pass1.report.json
          RENOVATE_CONFIG_FILE: ${{ steps.targeted-config.outputs.config-file || inputs.config-file }}

      - name: Decide whether Renovate pass 2 is needed
        id: renovate-pass2
        if: success() && inputs.dry-run == ''
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/.renovate-out/pass1.report.json"
          if [ ! -f "$report" ]; then
            echo "::error title=Renovate report missing::Expected $report — Renovate may have failed before writing it."
            exit 1
          fi

          if jq -e '.. | objects | select(.result? == "repository-changed")' "$report" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Renovate pass 1 reported repository-changed; pass 2 will run."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Renovate pass 1 did not report repository-changed; pass 2 will be skipped."
          fi

      - name: Self-hosted Renovate (pass 2 — catches repository-changed quirk)
        # Renovate occasionally exits with `"result": "repository-changed"`
        # after pushing a branch update but BEFORE opening the PR, deferring
        # PR creation to the next scheduled run. A second idempotent pass
        # right after the first closes this gap. Keep this conditional:
        # an unconditional second pass can race with a human merge from pass 1
        # and rewrite the closed PR title/body to a newer available version
        # without changing the already-merged commit.
        if: success() && inputs.dry-run == '' && steps.renovate-pass2.outputs.run == 'true'
        uses: renovatebot/github-action@v46.2.6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          renovate-image: ${{ inputs.renovate-image || 'ghcr.io/renovatebot/renovate' }}
          renovate-version: 43.275.0
          docker-network: host
          docker-volumes: |
            ${{ github.workspace }}/.renovate-out:/out
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy|PNPM_CONFIG_MINIMUM_RELEASE_AGE)$'
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_BINARY_SOURCE: install
          RENOVATE_CACHE_DIR: /out/cache
          RENOVATE_REPOSITORY_CACHE: 'enabled'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          RENOVATE_ALLOWED_COMMANDS: '^(?:uv lock(?: --refresh)?|\./\.renovate/[A-Za-z0-9_.-]+\.py|\./scripts/sync-shared)$'
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"PNPM_CONFIG_MINIMUM_RELEASE_AGE":"0"}'
          RENOVATE_REPORT_TYPE: 'file'
          RENOVATE_REPORT_PATH: /out/pass2.report.json
          RENOVATE_CONFIG_FILE: ${{ steps.targeted-config.outputs.config-file || inputs.config-file }}

      - name: Checkout shared repair scripts
        if: success() && inputs.dry-run == '' && inputs.repair-branches
        uses: actions/checkout@v7
        with:
          repository: jr200-labs/github-action-templates
          ref: master
          path: _gha_templates
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Force-rebase Renovate branches
        if: success() && inputs.dry-run == '' && inputs.rebase-branches
        shell: bash
        run: ./_gha_templates/scripts/repair-renovate-rebase-branches.sh
        env:
          RENOVATE_REPAIR_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RENOVATE_REPAIR_LOCKFILES: ${{ inputs.repair-lockfiles }}

      - name: Set up uv for Python branch repair
        if: success() && inputs.dry-run == '' && inputs.repair-branches && hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v10.0.1

      - name: Repair stale uv.lock on Renovate Python branches
        if: success() && inputs.dry-run == '' && inputs.repair-branches && hashFiles('pyproject.toml') != ''
        shell: bash
        run: ./_gha_templates/scripts/repair-renovate-uv-lock-branches.sh
        env:
          RENOVATE_REPAIR_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up pnpm for shared branch repair
        if: success() && inputs.dry-run == '' && inputs.repair-branches && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Resolve Node version for shared branch repair
        id: repair-node-version
        if: success() && inputs.dry-run == '' && inputs.repair-branches && hashFiles('pnpm-lock.yaml') != ''
        shell: bash
        run: |
          node_version=24.18.0
          if [ -f .node-version ]; then node_version="$(head -n 1 .node-version)"; fi
          if [ -f .nvmrc ]; then node_version="$(head -n 1 .nvmrc)"; fi
          echo "version=${node_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node for shared branch repair
        if: success() && inputs.dry-run == '' && inputs.repair-branches && hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.repair-node-version.outputs.version }}

      - name: Repair stale pnpm lockfiles on Renovate branches
        if: success() && inputs.dry-run == '' && inputs.repair-lockfiles && hashFiles('pnpm-lock.yaml') != ''
        shell: bash
        run: ./_gha_templates/scripts/repair-renovate-pnpm-lock-branches.sh
        env:
          RENOVATE_REPAIR_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install Cocogitto for shared branch repair
        if: success() && inputs.dry-run == '' && inputs.repair-branches
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true

      - name: Repair generated shared workflow drift on Renovate branches
        if: success() && inputs.dry-run == '' && inputs.repair-branches
        shell: bash
        run: ./_gha_templates/scripts/repair-renovate-shared-workflow-branches.sh
        env:
          RENOVATE_REPAIR_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Fail on Renovate problems
        # Reads Renovate's structured JSON report. Fails the workflow
        # on problems except the known vulnerability-alert permission
        # warning. If the report is missing, that's also a hard fail
        # (Renovate may have crashed or couldn't write the file).
        if: always() && inputs.dry-run == ''
        shell: bash
        run: |
          set -euo pipefail
          reports=()
          for label in pass1 pass2; do
            report="$GITHUB_WORKSPACE/.renovate-out/${label}.report.json"
            if [ ! -f "$report" ]; then
              if [ "$label" = "pass2" ] && [ "${{ steps.renovate-pass2.outputs.run || 'false' }}" != "true" ]; then
                continue
              fi
              echo "::error title=Renovate report missing::Expected $report — Renovate may have failed before writing it."
              exit 1
            fi
            reports+=("$report")
          done

          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/scripts/lint-renovate-report-problems.sh" \
            -o /tmp/lint-renovate-report-problems.sh
          chmod +x /tmp/lint-renovate-report-problems.sh

          if ! /tmp/lint-renovate-report-problems.sh "${reports[@]}"; then
            echo "::error title=Renovate problems::Renovate emitted warnings/errors (see groups above)."
            exit 1
          fi
          echo "no Renovate problems"
