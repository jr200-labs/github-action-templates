name: template-release-please

# Reusable workflow that runs googleapis/release-please-action with a
# GitHub App installation token, so tags and GitHub Releases it creates
# trigger downstream workflows (which GITHUB_TOKEN-created tags would not).
#
# Caller repos supply the release-please config + manifest files, and
# plug in whatever downstream action they want (e.g. dispatch a docker
# build) using the outputs exposed here.
#
# IMPORTANT: caller MUST declare these top-level permissions — otherwise
# the run may fail with `startup_failure` and no logs on some repos
# (see GOTCHAS.md #12):
#
#   permissions:
#     contents: write
#     pull-requests: write

on:
  workflow_call:
    inputs:
      release-type:
        description: 'release-please release-type: node | python | go | simple | ... (overrides per-package setting in config-file)'
        required: false
        type: string
        default: ''
      target-branch:
        description: 'Branch release-please tracks'
        required: false
        type: string
        default: 'master'
      config-file:
        description: 'Path to release-please config JSON'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest-file:
        description: 'Path to release-please manifest JSON'
        required: false
        type: string
        default: '.release-please-manifest.json'
      client-id:
        description: 'GitHub App client ID (defaults to vars.INTEGRATION_CLIENT_ID)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''
    secrets:
      app_private_key:
        description: 'GitHub App private key (defaults to secrets.INTEGRATION_APP_PRIVATE_KEY via caller)'
        required: true
    outputs:
      release_created:
        description: 'true if release-please created one or more releases on this run'
        value: ${{ jobs.release-please.outputs.release_created }}
      releases:
        description: 'JSON array of released paths, components, tags, versions, and SHAs'
        value: ${{ jobs.release-please.outputs.releases }}
      tag_name:
        description: 'tag name created (e.g. v1.2.3)'
        value: ${{ jobs.release-please.outputs.tag_name }}
      sha:
        description: 'sha of the release commit'
        value: ${{ jobs.release-please.outputs.sha }}
      version:
        description: 'full version (e.g. 1.2.3)'
        value: ${{ jobs.release-please.outputs.version }}
      major:
        value: ${{ jobs.release-please.outputs.major }}
      minor:
        value: ${{ jobs.release-please.outputs.minor }}
      patch:
        value: ${{ jobs.release-please.outputs.patch }}

jobs:
  release-please:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    concurrency:
      group: release-please-${{ github.repository }}-${{ inputs.target-branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.normalize-releases.outputs.release_created }}
      releases: ${{ steps.normalize-releases.outputs.releases || '[]' }}
      tag_name: ${{ steps.normalize-releases.outputs.tag_name }}
      sha: ${{ steps.normalize-releases.outputs.sha }}
      version: ${{ steps.normalize-releases.outputs.version }}
      major: ${{ steps.normalize-releases.outputs.major }}
      minor: ${{ steps.normalize-releases.outputs.minor }}
      patch: ${{ steps.normalize-releases.outputs.patch }}
    steps:
      - name: Checkout (for config validation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync shared release config
        shell: bash
        run: |
          mkdir -p .shared
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/sync.sh" \
            -o .shared/sync.sh
          chmod +x .shared/sync.sh
          .shared/sync.sh

      - name: Validate release-please-config.json
        # Fail fast on common misconfigurations — release-please defaults
        # release-type to `node` when omitted, which silently breaks
        # Python/Go/Rust repos with `Missing required file: package.json`
        # AFTER the conventional-commit PR has been merged. See
        # shared/lint-release-please-config.sh for the full ruleset.
        # The preceding sync fetches this validator from the consumer's
        # pinned shared ref together with the config base.
        shell: bash
        run: |
          chmod +x .shared/lint-release-please-config.sh
          .shared/lint-release-please-config.sh "${{ inputs.config-file }}"

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true

      - name: Configure Git identity for Cocogitto
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install message text policy
        shell: bash
        run: |
          set -euo pipefail
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/.githooks/lint-message-text.sh" \
            -o /tmp/lint-message-text.sh
          chmod +x /tmp/lint-message-text.sh

      - name: Verify unreleased commit subjects
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '."." // empty' "${{ inputs.manifest-file }}")"
          if [ -z "${version}" ]; then
            echo "No root manifest version found; skipping unreleased commit lint."
            exit 0
          fi

          include_v="$(jq -r '."include-v-in-tag" // true' "${{ inputs.config-file }}")"
          include_component="$(jq -r '."include-component-in-tag" // false' "${{ inputs.config-file }}")"
          component="$(jq -r '.packages["."].component // empty' "${{ inputs.config-file }}")"
          if [ "${include_v}" = "false" ]; then
            tag="${version}"
          else
            tag="v${version}"
          fi
          if [ "${include_component}" = "true" ] && [ -n "${component}" ]; then
            tag="${component}-${tag}"
          fi

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} not found; skipping unreleased commit lint."
            exit 0
          fi

          git log --format=%s "${tag}..HEAD" > /tmp/unreleased-commit-subjects
          if [ ! -s /tmp/unreleased-commit-subjects ]; then
            echo "No unreleased commits found after ${tag}."
            exit 0
          fi

          while IFS= read -r subject; do
            [ -n "${subject}" ] || continue
            subject_file="$(mktemp)"
            printf '%s\n' "${subject}" > "${subject_file}"
            /tmp/lint-message-text.sh "unreleased commit subject" "${subject_file}"
            cog verify --file "${subject_file}"
            rm -f "${subject_file}"
          done < /tmp/unreleased-commit-subjects

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ inputs.client-id || vars.INTEGRATION_CLIENT_ID }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Snapshot releases before release-please
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | unique' \
            > /tmp/release-tags-before.json

      - name: Run release-please
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
          release-type: ${{ inputs.release-type }}

      - name: Wait before retrying release-please
        if: steps.release.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Retry release-please
        id: release-retry
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
          release-type: ${{ inputs.release-type }}

      - name: Normalize released components
        id: normalize-releases
        if: always() && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          FIRST_PATHS: ${{ steps.release.outputs.paths_released || '[]' }}
          FIRST_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
          RETRY_PATHS: ${{ steps.release-retry.outputs.paths_released || '[]' }}
          RETRY_OUTPUTS: ${{ toJSON(steps.release-retry.outputs) }}
          RELEASE_SHA: ${{ github.sha }}
          # Dispatching the caller at a release tag is an explicit replay of
          # downstream publication for a release whose original fan-out was
          # interrupted. Branch dispatches retain normal release-please behavior.
          REPLAY_TAG: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail

          after_tags=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
              | jq -Rsc 'split("\n") | map(select(length > 0)) | unique'
          )
          before_tags=$(cat /tmp/release-tags-before.json)
          curl -sfL \
            "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/scripts/reconcile-release-please.sh" \
            -o /tmp/reconcile-release-please.sh
          chmod +x /tmp/reconcile-release-please.sh
          releases=$(BEFORE_TAGS="$before_tags" AFTER_TAGS="$after_tags" /tmp/reconcile-release-please.sh)

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          if [ "$(jq 'length' <<<"$releases")" -gt 0 ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

          primary_release=$(jq -c '([.[] | select(.path == ".")][0] // .[0]) // empty' <<<"$releases")
          if [ -n "$primary_release" ]; then
            version=$(jq -r '.version' <<<"$primary_release")
            echo "tag_name=$(jq -r '.tag_name' <<<"$primary_release")" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.sha' <<<"$primary_release")" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            IFS=. read -r major minor patch_rest <<<"$version"
            echo "major=$major" >> "$GITHUB_OUTPUT"
            echo "minor=$minor" >> "$GITHUB_OUTPUT"
            echo "patch=${patch_rest%%-*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect duplicate release tag
        id: duplicate-release
        if: steps.release.outcome == 'failure' && steps.release-retry.outcome == 'failure' && steps.normalize-releases.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '."." // empty' "$MANIFEST_FILE")"
          if [ -z "$version" ]; then
            echo "No root manifest version found; preserving release-please failure."
            exit 0
          fi

          include_v="$(jq -r '."include-v-in-tag" // true' "$CONFIG_FILE")"
          include_component="$(jq -r '."include-component-in-tag" // false' "$CONFIG_FILE")"
          component="$(jq -r '.packages["."].component // empty' "$CONFIG_FILE")"
          if [ "$include_v" = "false" ]; then
            tag="$version"
          else
            tag="v${version}"
          fi
          if [ "$include_component" = "true" ] && [ -n "$component" ]; then
            tag="${component}-${tag}"
          fi

          subject="$(git log -1 --format=%s)"
          expected_subject="chore(${TARGET_BRANCH}): release ${version}"
          if [ "$subject" != "$expected_subject" ]; then
            echo "HEAD subject is not '${expected_subject}'; preserving release-please failure."
            exit 0
          fi

          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,url 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            echo "Release $tag does not exist; preserving release-please failure."
            exit 0
          fi

          release_sha="$(jq -r '.targetCommitish // ""' <<<"$release_json")"
          release_url="$(jq -r '.url' <<<"$release_json")"
          echo "Release $tag already exists at ${release_sha}; treating duplicate publish as idempotent."
          echo "release_url=${release_url}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          jq -cn \
            --arg tag_name "$tag" \
            --arg version "$version" \
            --arg sha "$release_sha" \
            '[{path: ".", component: ".", tag_name: $tag_name, version: $version, sha: $sha}]' \
            | sed 's/^/releases=/' >> "$GITHUB_OUTPUT"
          echo "duplicate=true" >> "$GITHUB_OUTPUT"

      - name: Fail release-please
        if: steps.release.outcome == 'failure' && steps.release-retry.outcome == 'failure' && steps.normalize-releases.outputs.release_created != 'true' && steps.duplicate-release.outputs.duplicate != 'true'
        shell: bash
        run: |
          echo "::error title=release-please failed::release-please failed and no duplicate existing release tag was detected."
          exit 1

      - name: Set up uv for release PR lockfiles
        if: steps.release.outcome == 'success' || steps.release-retry.outcome == 'success'
        uses: astral-sh/setup-uv@v10.1.0

      - name: Refresh uv.lock on release PR
        if: steps.release.outcome == 'success' || steps.release-retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          FIRST_PRS: ${{ steps.release.outputs.prs || '[]' }}
          RETRY_PRS: ${{ steps.release-retry.outputs.prs || '[]' }}
        shell: bash
        run: |
          set -euo pipefail

          # Use action outputs, not a reconstructed branch name: grouped and
          # separate component releases have different branch conventions.
          prs=$(jq -cen --argjson first "$FIRST_PRS" --argjson retry "$RETRY_PRS" '
            if ($first | type) != "array" or ($retry | type) != "array" then
              error("Expected release PR arrays")
            else ($first + $retry | unique_by(.number)) end
            | if all(.[]; (.number | type) == "number" and .number > 0
                and (.headBranchName | type) == "string") then .
              else error("Invalid release PR identity") end')
          rows=$(jq -c '.[]' <<<"$prs")
          while IFS= read -r pr_json; do
            [ -n "$pr_json" ] || continue
            pr_number=$(jq -r '.number' <<<"$pr_json")
            head_ref=$(jq -r '.headBranchName' <<<"$pr_json")
            git check-ref-format "refs/heads/${head_ref}"
            live=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json number,headRefName,baseRefName,state,isCrossRepository)
            jq -e --arg head "$head_ref" --arg base "$TARGET_BRANCH" --argjson number "$pr_number" '
              .number == $number and .headRefName == $head and .baseRefName == $base
              and .state == "OPEN" and .isCrossRepository == false' <<<"$live" >/dev/null

            git fetch origin "refs/heads/${head_ref}"
            git checkout --detach FETCH_HEAD
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
            locks=$(git ls-files -- uv.lock ':(glob)**/uv.lock')
            while IFS= read -r lock; do
              [ -n "$lock" ] || continue
              directory=$(dirname "$lock")
              [ -f "$directory/pyproject.toml" ] || continue
              (
                cd "$directory"
                uv lock
                uv lock --check
              )
              git add -- "$lock"
            done <<<"$locks"
            if git diff --cached --quiet; then
              echo "Release PR #${pr_number}: lockfiles already up to date or not applicable."
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update release lockfile"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${head_ref}"

            # Reopening forces checks onto the refreshed head without a no-op commit.
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" -X PATCH -f state=closed >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" -X PATCH -f state=open >/dev/null
          done <<<"$rows"

      - name: Close stale release PRs after publish
        if: steps.normalize-releases.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          RELEASE_SHA: ${{ steps.normalize-releases.outputs.sha }}
          RELEASE_TAG: ${{ steps.normalize-releases.outputs.tag_name }}
        shell: bash
        run: |
          head_ref="release-please--branches--${TARGET_BRANCH}"
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${head_ref}" \
            --json number,title,headRefOid \
            --jq '.[] | @base64' | while IFS= read -r row; do
              [ -z "${row}" ] && continue
              pr_json=$(printf '%s' "${row}" | base64 --decode)
              pr_number=$(jq -r '.number' <<<"${pr_json}")
              pr_title=$(jq -r '.title' <<<"${pr_json}")
              pr_head_oid=$(jq -r '.headRefOid' <<<"${pr_json}")

              case "${pr_title}" in
                "chore(${TARGET_BRANCH}): release "*) ;;
                *)
                  echo "leaving PR #${pr_number} open (title does not match release PR pattern)"
                  continue
                  ;;
              esac

              if [ "${pr_head_oid}" = "${RELEASE_SHA}" ]; then
                echo "leaving PR #${pr_number} open (head matches published release commit)"
                continue
              fi

              gh pr close "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Closing stale release PR after ${RELEASE_TAG} was already published from ${RELEASE_SHA}."
              echo "closed stale release PR #${pr_number}"
            done
