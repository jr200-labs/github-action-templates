name: template-lint-commits

# Reusable workflow that validates all commits in a pull request and the
# PR title against the Conventional Commits spec using Cocogitto. The PR
# title matters because org policy is squash-only, and GitHub uses the PR
# title as the squash commit subject.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''
      fail-on-warnings:
        description: 'Deprecated; retained for caller compatibility'
        required: false
        type: boolean
        default: false
      config-file:
        description: 'Deprecated; retained for caller compatibility'
        required: false
        type: string
        default: ''

jobs:
  commitlint:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          install-only: true

      - name: Configure Git identity for Cocogitto
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install message text policy
        shell: bash
        run: |
          set -euo pipefail
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/.githooks/lint-message-text.sh" \
            -o /tmp/lint-message-text.sh
          chmod +x /tmp/lint-message-text.sh

      - name: Verify PR title
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          title_file="$(mktemp)"
          printf '%s\n' "${PR_TITLE}" > "${title_file}"
          if [[ "${PR_BRANCH:-}" == renovate/* && "${PR_AUTHOR:-}" == *'[bot]' && "${PR_BODY:-}" == *'<!--renovate-debug:'* ]]; then
            echo "PR title attribution check: skipped (Renovate)"
          else
            /tmp/lint-message-text.sh "PR title" "${title_file}"
          fi
          cog verify --file "${title_file}"
          rm -f "${title_file}"

      - name: Check commits
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cog check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            exit 0
          fi

          range=""
          before="${{ github.event.before || '' }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${before}" ] && [[ ! "${before}" =~ ^0+$ ]]; then
            range="${before}..${{ github.sha }}"
          fi

          if [ -z "${range}" ]; then
            default_branch="${{ github.event.repository.default_branch }}"
            if [ -n "${default_branch}" ] && git rev-parse --verify "origin/${default_branch}" >/dev/null 2>&1; then
              head_sha="$(git rev-parse HEAD)"
              default_sha="$(git rev-parse "origin/${default_branch}")"
              if [ "${head_sha}" != "${default_sha}" ]; then
                merge_base="$(git merge-base HEAD "origin/${default_branch}")"
                range="${merge_base}..HEAD"
              fi
            fi
          fi

          if [ -z "${range}" ]; then
            latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "${latest_tag}" ]; then
              range="${latest_tag}..HEAD"
            else
              range="HEAD"
            fi
          fi

          if [[ "${PR_BRANCH:-}" == renovate/* && "${PR_AUTHOR:-}" == *'[bot]' && "${PR_BODY:-}" == *'<!--renovate-debug:'* ]]; then
            # Renovate derives commit subjects from package names. Keep the
            # Conventional Commit check below, but do not interpret dependency
            # identifiers such as @openai/codex as human attribution.
            echo "Commit attribution checks: skipped (Renovate)"
          else
            while IFS= read -r sha; do
              message_file="$(mktemp)"
              git log -1 --format=%B "${sha}" > "${message_file}"
              /tmp/lint-message-text.sh "commit ${sha}" "${message_file}"
              rm -f "${message_file}"
            done < <(git rev-list --reverse "${range}")
          fi

          cog check "${range}"
