name: template-ci-npmjs

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: ""
      node-version:
        description: "node version"
        required: false
        type: string
        default: ""
      pnpm-version:
        description: "Deprecated; pnpm is read from package.json packageManager"
        required: false
        type: string
        default: ""
      run-integration:
        description: "Whether to run the integration test job (pnpm test:integration)"
        required: false
        type: boolean
        default: true
      run-size-limit:
        description: "Run size-limit bundle-size check and post PR comment with diff (requires .size-limit.json and a 'size' script)"
        required: false
        type: boolean
        default: false
      minimum-release-age:
        description: "pnpm minimumReleaseAge for normal CI installs. Keep at 0 so tests/builds are not blocked by advisory package-age policy."
        required: false
        type: string
        default: "0"
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''

env:
  # Disable Next.js anonymous telemetry on CI. No-op for non-Next consumers.
  NEXT_TELEMETRY_DISABLED: "1"

# Cancel superseded runs on the same PR. Master/tag pushes are not
# cancelled (force-pushes to main branches are rare and usually intentional).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Detects whether bundle inputs changed. Used to gate the expensive
    # size-limit job, which otherwise runs a full build twice (base + PR)
    # on every PR regardless of whether the change could affect bundle size.
    if: inputs.run-size-limit && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    permissions:
      pull-requests: read
    outputs:
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bundle:
              - 'src/**'
              - 'apps/**'
              - 'packages/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.*'
              - 'vite.config.*'
              - '**/vite.config.*'
              - '.size-limit.json'

  unit:
    outputs:
      inline-integration: ${{ steps.ci-options.outputs.inline-integration }}
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Resolve toolchain
        id: toolchain
        env:
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          node_version="$INPUT_NODE_VERSION"
          if [ -z "$node_version" ] && [ -f .node-version ]; then node_version="$(head -n 1 .node-version)"; fi
          echo "node-version=${node_version:-22}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version is read from package.json "packageManager". The deprecated
        # input remains declared so existing callers do not break.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Read repository CI options
        id: ci-options
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { config } = require('./package.json');
          console.log('inline-integration=' + (config?.ci_inline_integration === true));
          console.log('cache-nextjs=' + (config?.ci_cache_nextjs !== false));
          NODE

      - name: Cache Next.js build
        if: steps.ci-options.outputs.cache-nextjs == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: git tag v${TAG} but package.json has version ${PKG_VERSION}"
            exit 1
          fi
          echo "✓ Version matches: v${TAG}"

      - name: Sync shared lint config
        run: |
          mkdir -p .shared
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/sync.sh" \
            -o .shared/sync.sh
          chmod +x .shared/sync.sh
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/eslint.config.mjs" \
            -o .shared/eslint.config.mjs
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/lint-release-please-config.sh" \
            -o .shared/lint-release-please-config.sh
          chmod +x .shared/lint-release-please-config.sh

      - name: Lint release-please config
        run: |
          if [ -f .release-please.local.json ] || [ -f release-please-config.json ]; then
            .shared/sync.sh
            chmod +x .shared/lint-release-please-config.sh
            .shared/lint-release-please-config.sh release-please-config.json
          else
            echo "No release-please config found, skipping"
          fi

      - name: Syncpack lint
        run: |
          if [ -f .syncpackrc.yaml ] || [ -f .syncpackrc.yml ]; then
            pnpm syncpack lint
          else
            echo "No syncpack config found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm lint
          else
            echo "No lint script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Test
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm test
          else
            echo "No test script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Build
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)" 2>/dev/null; then
            pnpm build
          else
            echo "No build script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Knip (dead-code detection)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.knip ? 0 : 1)" 2>/dev/null; then
            pnpm knip
          else
            echo "No knip script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Integration tests
        if: inputs.run-integration && steps.ci-options.outputs.inline-integration == 'true'
        run: &run-integration-tests |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:integration'] ? 0 : 1)" 2>/dev/null; then
            pnpm test:integration
          else
            echo "No test:integration script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

  integration:
    if: inputs.run-integration && needs.unit.outputs.inline-integration != 'true'
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Resolve toolchain
        id: toolchain
        env:
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          node_version="$INPUT_NODE_VERSION"
          if [ -z "$node_version" ] && [ -f .node-version ]; then node_version="$(head -n 1 .node-version)"; fi
          echo "node-version=${node_version:-22}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version is read from package.json "packageManager". The deprecated
        # input remains declared so existing callers do not break.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Integration tests
        run: *run-integration-tests
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

  size-limit:
    if: inputs.run-size-limit && github.event_name == 'pull_request' && needs.changes.outputs.bundle == 'true'
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    needs: [unit, changes]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Resolve toolchain
        id: toolchain
        env:
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          node_version="$INPUT_NODE_VERSION"
          if [ -z "$node_version" ] && [ -f .node-version ]; then node_version="$(head -n 1 .node-version)"; fi
          echo "node-version=${node_version:-22}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version is read from package.json "packageManager". The deprecated
        # input remains declared so existing callers do not break.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Build app
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)" 2>/dev/null; then
            pnpm build
          else
            echo "No build script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}

      - name: Check size limit
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.size ? 0 : 1)" 2>/dev/null; then
            pnpm size
          else
            echo "No size script found, skipping"
          fi
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}
