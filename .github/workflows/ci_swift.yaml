name: template-ci-swift

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref (leave empty to use the event's natural ref)"
        required: false
        type: string
        default: ""
      project:
        description: "Path to the Xcode project. Leave empty to auto-detect a single .xcodeproj."
        required: false
        type: string
        default: ""
      scheme:
        description: "Xcode scheme to build and test. Leave empty to use the project basename or a single shared scheme."
        required: false
        type: string
        default: ""
      destination:
        description: "xcodebuild destination. Leave empty to auto-detect macOS or an available iOS Simulator."
        required: false
        type: string
        default: ""
      configuration:
        description: "Xcode build configuration"
        required: false
        type: string
        default: "Debug"
      derived-data-path:
        description: "DerivedData output path"
        required: false
        type: string
        default: ".build/DerivedData"
      run-tests:
        description: "Whether to run xcodebuild test"
        required: false
        type: boolean
        default: true
      runner-verifier:
        description: "Use the runner-provisioned fixed Xcode verifier; fail if unavailable."
        required: false
        type: boolean
        default: false
      platform:
        description: "Platform for runner verification: ios or macos."
        required: false
        type: string
        default: "ios"
      runner:
        description: "Runner label for macOS/Xcode builds"
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure Metal toolchain
        if: ${{ !inputs.runner-verifier }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Resolve Xcode project, scheme, and destination
        id: xcode
        timeout-minutes: 3
        shell: bash
        env:
          RUNNER_VERIFIER: ${{ inputs.runner-verifier }}
          XCODE_PROJECT: ${{ inputs.project }}
          XCODE_SCHEME: ${{ inputs.scheme }}
          XCODE_DESTINATION: ${{ inputs.destination }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail

          project="$XCODE_PROJECT"
          if [ -z "$project" ]; then
            projects=()
            while IFS= read -r found_project; do
              projects+=("$found_project")
            done < <(find . -maxdepth 2 -name "*.xcodeproj" -type d | sort | sed 's#^\./##')
            if [ "${#projects[@]}" -ne 1 ]; then
              printf 'Expected exactly one .xcodeproj when project input is empty, found %d:\n' "${#projects[@]}" >&2
              printf '  %s\n' "${projects[@]}" >&2
              exit 1
            fi
            project="${projects[0]}"
          fi

          if [ ! -d "$project" ]; then
            echo "Xcode project not found: $project" >&2
            exit 1
          fi

          scheme="$XCODE_SCHEME"
          if [ -z "$scheme" ]; then
            project_basename="$(basename "$project" .xcodeproj)"
            schemes=()
            while IFS= read -r found_scheme; do
              schemes+=("$found_scheme")
            done < <(
              xcodebuild -list -json -project "$project" |
                /usr/bin/python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin).get("project", {}).get("schemes", [])))'
            )

            if printf '%s\n' "${schemes[@]}" | grep -Fxq "$project_basename"; then
              scheme="$project_basename"
            elif [ "${#schemes[@]}" -eq 1 ]; then
              scheme="${schemes[0]}"
            else
              printf 'Scheme input is empty and no unambiguous scheme could be selected for %s.\n' "$project" >&2
              printf 'Expected a scheme named %s or exactly one shared scheme. Found:\n' "$project_basename" >&2
              printf '  %s\n' "${schemes[@]}" >&2
              exit 1
            fi
          fi

          if [ "$RUNNER_VERIFIER" = "true" ] && [ -n "$XCODE_DESTINATION" ]; then
            echo "Runner verification owns the destination; leave destination empty." >&2
            exit 1
          fi
          destination="$XCODE_DESTINATION"
          simulator_id=""
          if [ -z "$destination" ]; then
            build_settings="$(xcodebuild \
                -project "$project" \
                -scheme "$scheme" \
                -configuration "$XCODE_CONFIGURATION" \
                -showBuildSettings)"
            supported_platforms="$(/usr/bin/awk '
              /^[[:space:]]*SUPPORTED_PLATFORMS = / {
                sub(/^[[:space:]]*SUPPORTED_PLATFORMS = /, "")
                print
                exit
              }
            ' <<< "$build_settings")"

            if [[ " $supported_platforms " == *" iphonesimulator "* ]]; then
              if [ "$RUNNER_VERIFIER" = "true" ]; then
                destination="platform=iOS Simulator"
              else
                simulator_selection="$(/usr/bin/python3 - "$project" "$scheme" "$XCODE_CONFIGURATION" <<'PYTHON'
          import json
          import re
          import subprocess
          import sys

          def command(args):
              return subprocess.check_output(args, text=True, timeout=60)

          project, scheme, configuration = sys.argv[1:]
          runtimes = json.loads(command(["xcrun", "simctl", "list", "runtimes", "--json"]))
          devices = json.loads(command(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          destinations = command(["xcodebuild", "-project", project, "-scheme", scheme,
                                  "-configuration", configuration, "-showdestinations"])
          compatible = set()
          section = False
          for line in destinations.splitlines():
              if "destinations" in line.lower() and ":" in line and "{" not in line:
                  section = bool(re.search(r"\bAvailable destinations for\b|\bDestinations compatible with\b", line, re.I))
              if section and "platform:iOS Simulator" in line:
                  match = re.search(r"(?:^|[, {])id:([^,}]+)", line)
                  if match:
                      compatible.add(match[1].strip())
          candidates = []
          for runtime in runtimes["runtimes"]:
              identifier = runtime.get("identifier", "")
              match = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+(?:-\d+)+)", identifier)
              if not match or not runtime.get("isAvailable"):
                  continue
              version = tuple(int(part) for part in match[1].split("-"))
              for device in devices["devices"].get(identifier, []):
                  device_type = device.get("deviceTypeIdentifier", "")
                  if device.get("isAvailable") and device.get("udid") in compatible and device_type:
                      candidates.append((version, "iPhone" in device_type, device_type, identifier))
          if not candidates:
              raise SystemExit("No available project-compatible iOS simulator")
          _, _, device_type, runtime = max(candidates)
          print(device_type, runtime)
          PYTHON
                )"
                read -r simulator_device_type simulator_runtime <<< "$simulator_selection"
                simulator_name="ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
                simulator_id="$(xcrun simctl create "$simulator_name" "$simulator_device_type" "$simulator_runtime")"
                echo "simulator-id=$simulator_id" >> "$GITHUB_OUTPUT"
                destination="id=$simulator_id"
              fi
            elif [[ " $supported_platforms " == *" macosx "* ]]; then
              destination="platform=macOS"
            else
              echo "Could not auto-detect a supported test destination from: $supported_platforms" >&2
              echo "Pass the reusable workflow destination input explicitly." >&2
              exit 1
            fi
          fi

          for value in "$project" "$scheme" "$destination"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Xcode inputs must be single-line values." >&2
              exit 1
            fi
          done
          {
            echo "project=$project"
            echo "scheme=$scheme"
            echo "destination=$destination"
            echo "simulator-id=$simulator_id"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved Xcode project: $project"
          echo "Resolved Xcode scheme: $scheme"
          echo "Resolved Xcode destination: $destination"

      - name: Run runner-provisioned Xcode verification
        if: inputs.runner-verifier
        timeout-minutes: 18
        shell: bash
        env:
          XCODE_PROJECT: ${{ steps.xcode.outputs.project }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
          XCODE_PLATFORM: ${{ inputs.platform }}
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          set -euo pipefail
          if [[ "${XCODE_VERIFIER:-}" != /* ]] || [ ! -x "$XCODE_VERIFIER" ]; then
            echo "Runner Xcode verification requires a provisioned absolute executable path." >&2
            exit 1
          fi
          if ! /usr/bin/python3 -c 'import os,pathlib,sys; sys.exit(pathlib.Path(os.environ["XCODE_VERIFIER"]).resolve().is_relative_to(pathlib.Path.cwd().resolve()))'; then
            echo "The Xcode verifier must be provisioned outside the checkout." >&2
            exit 1
          fi
          arguments=(--project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
                     --platform "$XCODE_PLATFORM" --configuration "$XCODE_CONFIGURATION")
          if [ "$RUN_TESTS" != "true" ]; then arguments+=(--no-tests); fi
          "$XCODE_VERIFIER" "${arguments[@]}"

      - name: Build
        if: ${{ !inputs.runner-verifier }}
        shell: bash
        env:
          XCODE_PROJECT: ${{ steps.xcode.outputs.project }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
          XCODE_DESTINATION: ${{ steps.xcode.outputs.destination }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
          XCODE_DERIVED_DATA: ${{ inputs.derived-data-path }}
        run: >
          xcodebuild
          -project "$XCODE_PROJECT"
          -scheme "$XCODE_SCHEME"
          -destination "$XCODE_DESTINATION"
          -configuration "$XCODE_CONFIGURATION"
          -derivedDataPath "$XCODE_DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Test
        if: inputs.run-tests && !inputs.runner-verifier
        shell: bash
        env:
          XCODE_PROJECT: ${{ steps.xcode.outputs.project }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
          XCODE_DESTINATION: ${{ steps.xcode.outputs.destination }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
          XCODE_DERIVED_DATA: ${{ inputs.derived-data-path }}
        run: >
          xcodebuild
          -project "$XCODE_PROJECT"
          -scheme "$XCODE_SCHEME"
          -destination "$XCODE_DESTINATION"
          -configuration "$XCODE_CONFIGURATION"
          -derivedDataPath "$XCODE_DERIVED_DATA"
          -parallel-testing-enabled NO
          -maximum-concurrent-test-simulator-destinations 1
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test

      - name: Delete ephemeral iOS Simulator
        if: always() && steps.xcode.outputs.simulator-id != ''
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.xcode.outputs.simulator-id }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID"
          xcrun simctl list devices --json | /usr/bin/python3 -c '
          import json, sys
          identifier = sys.argv[1]
          if any(device.get("udid") == identifier
                 for devices in json.load(sys.stdin)["devices"].values()
                 for device in devices):
              raise SystemExit("Owned simulator remains after deletion")
          ' "$SIMULATOR_ID"

      - name: Retain Xcode test results
        if: always() && inputs.runner-verifier && inputs.run-tests
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .build/xcode-results/**/Results.xcresult
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 5
