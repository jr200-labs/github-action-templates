name: template-ci-swift

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref (leave empty to use the event's natural ref)"
        required: false
        type: string
        default: ""
      project:
        description: "Path to the Xcode project. Leave empty to auto-detect a single .xcodeproj."
        required: false
        type: string
        default: ""
      scheme:
        description: "Xcode scheme to build and test. Leave empty to use the project basename or a single shared scheme."
        required: false
        type: string
        default: ""
      destination:
        description: "xcodebuild destination. Leave empty to auto-detect macOS or an available iOS Simulator."
        required: false
        type: string
        default: ""
      configuration:
        description: "Xcode build configuration"
        required: false
        type: string
        default: "Debug"
      derived-data-path:
        description: "DerivedData output path"
        required: false
        type: string
        default: ".build/DerivedData"
      run-tests:
        description: "Whether to run xcodebuild test"
        required: false
        type: boolean
        default: true
      scotty-unattended:
        description: "Opt into the installed Scotty fixed unsigned Xcode contract; fail if unavailable."
        required: false
        type: boolean
        default: false
      scotty-platform:
        description: "Platform for Scotty unattended execution: ios (approved runtime) or macos."
        required: false
        type: string
        default: "ios"
      runner:
        description: "Runner label for macOS/Xcode builds"
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure Metal toolchain
        shell: bash
        env:
          SCOTTY_TOOLCHAIN_REQUEST_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            exit 0
          fi
          scotty_cli="/Applications/Scotty.app/Contents/MacOS/scotty"
          if [ ! -x "$scotty_cli" ]; then
            scotty_cli="$HOME/Applications/Scotty.app/Contents/MacOS/scotty"
          fi
          if [ -x "$scotty_cli" ] && "$scotty_cli" status | python3 -c \
            'import json,sys; raise SystemExit("toolchain-catalog" not in json.load(sys.stdin).get("capabilities", []))'; then
            "$scotty_cli" ensure-toolchain \
              --toolchain metal-toolchain \
              --request-key "$SCOTTY_TOOLCHAIN_REQUEST_KEY" \
              --wait
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Resolve Xcode project, scheme, and destination
        id: xcode
        timeout-minutes: 3
        shell: bash
        env:
          SCOTTY_UNATTENDED: ${{ inputs.scotty-unattended }}
          XCODE_PROJECT: ${{ inputs.project }}
          XCODE_SCHEME: ${{ inputs.scheme }}
          XCODE_DESTINATION: ${{ inputs.destination }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail

          project="$XCODE_PROJECT"
          if [ -z "$project" ]; then
            projects=()
            while IFS= read -r found_project; do
              projects+=("$found_project")
            done < <(find . -maxdepth 2 -name "*.xcodeproj" -type d | sort | sed 's#^\./##')
            if [ "${#projects[@]}" -ne 1 ]; then
              printf 'Expected exactly one .xcodeproj when project input is empty, found %d:\n' "${#projects[@]}" >&2
              printf '  %s\n' "${projects[@]}" >&2
              exit 1
            fi
            project="${projects[0]}"
          fi

          if [ ! -d "$project" ]; then
            echo "Xcode project not found: $project" >&2
            exit 1
          fi

          scheme="$XCODE_SCHEME"
          if [ -z "$scheme" ]; then
            project_basename="$(basename "$project" .xcodeproj)"
            schemes=()
            while IFS= read -r found_scheme; do
              schemes+=("$found_scheme")
            done < <(
              xcodebuild -list -json -project "$project" |
                /usr/bin/python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin).get("project", {}).get("schemes", [])))'
            )

            if printf '%s\n' "${schemes[@]}" | grep -Fxq "$project_basename"; then
              scheme="$project_basename"
            elif [ "${#schemes[@]}" -eq 1 ]; then
              scheme="${schemes[0]}"
            else
              printf 'Scheme input is empty and no unambiguous scheme could be selected for %s.\n' "$project" >&2
              printf 'Expected a scheme named %s or exactly one shared scheme. Found:\n' "$project_basename" >&2
              printf '  %s\n' "${schemes[@]}" >&2
              exit 1
            fi
          fi

          destination="$XCODE_DESTINATION"
          simulator_id=""
          if [ -z "$destination" ]; then
            build_settings="$(xcodebuild \
                -project "$project" \
                -scheme "$scheme" \
                -configuration "$XCODE_CONFIGURATION" \
                -showBuildSettings)"
            supported_platforms="$(/usr/bin/awk '
              /^[[:space:]]*SUPPORTED_PLATFORMS = / {
                sub(/^[[:space:]]*SUPPORTED_PLATFORMS = /, "")
                print
                exit
              }
            ' <<< "$build_settings")"

            if [[ " $supported_platforms " == *" iphonesimulator "* ]]; then
              if [ "$SCOTTY_UNATTENDED" = "true" ]; then
                destination="platform=iOS Simulator"
              else
              read -r simulator_device_type simulator_runtime < <(
                xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json
          import re
          import sys

          devices = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, runtime_devices in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in runtime_devices:
                  if device.get("isAvailable", True):
                      device_type = device.get("deviceTypeIdentifier", "")
                      if device_type:
                          candidates.append((version, "iPhone" in device_type, device_type, runtime))
          if not candidates:
              raise SystemExit("No available iOS Simulator found")
          _, _, device_type, runtime = max(candidates)
          print(device_type, runtime)
          '
              )
              simulator_name="ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
              simulator_id="$(xcrun simctl create "$simulator_name" "$simulator_device_type" "$simulator_runtime")"
              destination="id=$simulator_id"
              fi
            elif [[ " $supported_platforms " == *" macosx "* ]]; then
              destination="platform=macOS"
            else
              echo "Could not auto-detect a supported test destination from: $supported_platforms" >&2
              echo "Pass the reusable workflow destination input explicitly." >&2
              exit 1
            fi
          fi

          {
            echo "project=$project"
            echo "scheme=$scheme"
            echo "destination=$destination"
            echo "simulator-id=$simulator_id"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved Xcode project: $project"
          echo "Resolved Xcode scheme: $scheme"
          echo "Resolved Xcode destination: $destination"

      - name: Run Scotty unattended verification
        if: inputs.scotty-unattended
        timeout-minutes: 18
        shell: bash
        env:
          XCODE_PROJECT: ${{ steps.xcode.outputs.project }}
          XCODE_SCHEME: ${{ steps.xcode.outputs.scheme }}
          XCODE_CONFIGURATION: ${{ inputs.configuration }}
          SCOTTY_PLATFORM: ${{ inputs.scotty-platform }}
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          set -euo pipefail
          scotty_cli="/Applications/Scotty.app/Contents/MacOS/scotty"
          if [ ! -x "$scotty_cli" ]; then
            scotty_cli="$HOME/Applications/Scotty.app/Contents/MacOS/scotty"
          fi
          if [ ! -x "$scotty_cli" ]; then
            echo "Scotty unattended execution requires the installed executor." >&2
            exit 1
          fi
          arguments=(verify-action --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
                     --platform "$SCOTTY_PLATFORM" --configuration "$XCODE_CONFIGURATION")
          if [ "$RUN_TESTS" != "true" ]; then arguments+=(--no-tests); fi
          "$scotty_cli" "${arguments[@]}"

      - name: Build
        if: ${{ !inputs.scotty-unattended }}
        run: >
          xcodebuild
          -project "${{ steps.xcode.outputs.project }}"
          -scheme "${{ steps.xcode.outputs.scheme }}"
          -destination "${{ steps.xcode.outputs.destination }}"
          -configuration "${{ inputs.configuration }}"
          -derivedDataPath "${{ inputs.derived-data-path }}"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Test
        if: inputs.run-tests && !inputs.scotty-unattended
        run: >
          xcodebuild
          -project "${{ steps.xcode.outputs.project }}"
          -scheme "${{ steps.xcode.outputs.scheme }}"
          -destination "${{ steps.xcode.outputs.destination }}"
          -configuration "${{ inputs.configuration }}"
          -derivedDataPath "${{ inputs.derived-data-path }}"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test

      - name: Delete ephemeral iOS Simulator
        if: always() && steps.xcode.outputs.simulator-id != ''
        run: xcrun simctl delete "${{ steps.xcode.outputs.simulator-id }}"

      - name: Retain Scotty test results
        if: always() && inputs.scotty-unattended && inputs.run-tests
        uses: actions/upload-artifact@v7
        with:
          name: scotty-test-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .build/scotty-action-results/**/Results.xcresult
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
